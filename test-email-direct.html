<!DOCTYPE html>
<html>
<head>
  <title>Test HackMates Email Service</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
    }
    button {
      background: linear-gradient(135deg, #9333ea 0%, #2563eb 100%);
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px 0;
    }
    button:hover {
      opacity: 0.9;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
    }
    .success {
      background: #d1fae5;
      color: #065f46;
      border: 2px solid #10b981;
    }
    .error {
      background: #fee2e2;
      color: #991b1b;
      border: 2px solid #ef4444;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 2px solid #e5e7eb;
      border-radius: 6px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>🧪 Test HackMates Email Service</h1>
  <p>This will test if your Google Apps Script is working correctly.</p>
  
  <div>
    <label>Your Email:</label>
    <input type="email" id="email" placeholder="your-email@gmail.com" value="pavanmali0281@gmail.com">
    
    <label>Your Name:</label>
    <input type="text" id="name" placeholder="Your Name" value="Pavan Mali">
    
    <button onclick="testEmail()">Send Test Email</button>
  </div>
  
  <div id="result"></div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz06S2VLFwootzyy-TBr27Tz2y7riuZSiEG9YAVLRm6pf4RiKj3OzfSfbqfMF3xLvDe/exec";
    
    async function testEmail() {
      const email = document.getElementById('email').value;
      const name = document.getElementById('name').value;
      const resultDiv = document.getElementById('result');
      
      if (!email || !name) {
        alert('Please fill in all fields');
        return;
      }
      
      resultDiv.style.display = 'block';
      resultDiv.className = '';
      resultDiv.innerHTML = '⏳ Sending email...';
      
      try {
        // Try with CORS first (will fail but we can see the error)
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            email: email,
            name: name,
            subject: 'Test Email from HackMates',
            html: `
              <div style="font-family: Arial; padding: 20px; background: #f8f9fa;">
                <div style="max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px;">
                  <h1 style="color: #9333ea;">Test Email</h1>
                  <p>Hi ${name}!</p>
                  <p>This is a test email from HackMates Email Service.</p>
                  <p style="color: #10b981; font-weight: bold;">✅ If you received this, the service is working!</p>
                </div>
              </div>
            `
          })
        });
        
        const data = await response.json();
        
        if (data.success) {
          resultDiv.className = 'success';
          resultDiv.innerHTML = `
            ✅ <strong>Success!</strong><br>
            Email sent to: ${email}<br>
            Check your inbox (and spam folder)!<br>
            <small>Response: ${JSON.stringify(data, null, 2)}</small>
          `;
        } else {
          resultDiv.className = 'error';
          resultDiv.innerHTML = `
            ❌ <strong>Error:</strong><br>
            ${data.error || 'Unknown error'}<br>
            <small>${JSON.stringify(data, null, 2)}</small>
          `;
        }
      } catch (error) {
        // This is expected with no-cors mode
        resultDiv.className = 'success';
        resultDiv.innerHTML = `
          ⚠️ <strong>Request sent (no-cors mode)</strong><br>
          Cannot read response due to CORS, but request was sent.<br>
          Check your email inbox in 10-30 seconds.<br>
          <br>
          <strong>To verify:</strong><br>
          1. Check your email inbox<br>
          2. Check Google Apps Script execution logs<br>
          3. If no email arrives, check the script logs for errors
        `;
      }
    }
  </script>
</body>
</html>
